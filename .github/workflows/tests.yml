# The setup system and the extension packaging, on Linux and Windows, on the
# Blender versions the add-on supports. Runs on pushes to main, on pull
# requests into main (open a draft PR from dev for a test run that lands
# nothing) and by hand. The repo is public, so these minutes are free; keep
# macOS out (it is tested locally and costs ten times the minutes).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-system:
    name: Blender ${{ matrix.blender }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        blender: ["4.2.23", "4.5.14", "5.0.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-dist
          key: blender-${{ matrix.blender }}-${{ runner.os }}

      - name: Libraries Blender needs on a bare Linux runner
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: python3 scripts/ci/fetch_blender.py "${{ matrix.blender }}" "$RUNNER_TEMP/blender-dist"

      - name: Run the setup tests inside Blender
        shell: bash
        run: python3 scripts/ci/run_in_blender.py "$RUNNER_TEMP/blender-dist" "$GITHUB_WORKSPACE" tests/test_setup_catalogue.py tests/test_setup_downloader.py tests/test_setup_client.py tests/test_setup_state.py tests/test_extension.py

      - name: Validate and build the extension
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BLENDER=$(python3 scripts/ci/fetch_blender.py --path "$RUNNER_TEMP/blender-dist")
          "$BLENDER" --command extension validate .
          mkdir -p build
          "$BLENDER" --command extension build --source-dir . --output-dir build
          ls -l build
